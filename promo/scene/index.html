<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Tumbleweed Updater promo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Rendered frame by frame by ../render.mjs through window.promo.
       Open with ?play to watch it in real time with sound, or ?t=12.5 to
       look at one frame. -->
  <div id="stage">
    <div id="world">
      <canvas id="bg"></canvas>
      <div id="scenes"></div>
    </div>
    <canvas id="particles"></canvas>
    <div id="vignette"></div>
    <div id="letterbox"><div class="top"></div><div class="bottom"></div></div>
    <div id="flash"></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
