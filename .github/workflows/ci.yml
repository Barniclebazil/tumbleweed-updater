name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      - name: Install build & test dependencies
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install --no-recommends \
            git tar xz gzip findutils \
            python3 python3-pyside6 python3-pyte python3-pytest \
            rpm-build rpmlint \
            python-rpm-macros systemd-rpm-macros hicolor-icon-theme

      - uses: actions/checkout@v4

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest -q

      - name: Build the RPM
        run: sh packaging/build-rpm.sh

      - name: Lint the RPM
        run: rpmlint ~/rpmbuild/RPMS/noarch/*.rpm || true

      - name: Verify the RPM's declared dependencies
        run: rpm -qp --requires ~/rpmbuild/RPMS/noarch/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: ~/rpmbuild/RPMS/noarch/*.rpm
