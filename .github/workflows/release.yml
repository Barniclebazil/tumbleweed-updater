name: Release

# Tag a release:  git tag v0.2.0 && git push origin v0.2.0
#
# This builds the RPM, attaches it to a GitHub Release, and publishes a zypper
# repository to GitHub Pages so users can `zypper ar` it and get updates via
# `zypper dup` like any other package.
#
# Optional signing: add a repository secret GPG_PRIVATE_KEY (ASCII-armored
# private key). Without it the published repo is unsigned (gpgcheck=0).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the Release
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      - name: Install dependencies
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install --no-recommends \
            git tar xz gzip findutils rpm-build createrepo_c gpg2 \
            python3 python3-pyside6 python3-pyte python3-pytest \
            python-rpm-macros systemd-rpm-macros hicolor-icon-theme

      - uses: actions/checkout@v4

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest -q

      - name: Build RPM
        run: sh packaging/build-rpm.sh

      - name: Assemble the zypper repository
        env:
          PAGES_OWNER: ${{ github.repository_owner }}
          PAGES_REPO: ${{ github.event.repository.name }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: sh packaging/make-repo.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: public/*.rpm
          generate_release_notes: true

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
